[project]
name = "backend"
version = "0.1.0"
description = "SupportBuddy Backend - Journal processing and AI integration"
readme = "README.md"
authors = [
    { name = "Support Buddy Team" }
]
requires-python = ">=3.10.5"
dependencies = [
    "fastapi==0.111.0",
    "python-dotenv==1.0.1",
    "uvicorn==0.30.1",
    "notion-client==2.4.0",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "cryptography==42.0.7",
    "python-decouple==3.8",
    "httpx",
    "google-genai",
    "asyncpg",
    "tortoise-orm",
    "hypercorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "isort",
    "flake8",
]
serverless = [
    "python-dotenv==1.0.1",
    "tortoise-orm",
    "asyncpg",
    "google-genai",
    "httpx",
    "notion-client==2.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88