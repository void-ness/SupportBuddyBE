[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "SupportBuddy Backend - Journal processing and AI integration"
readme = "README.md"
authors = [
    { name = "Support Buddy Team" }
]
requires-python = ">=3.10.5"
dependencies = [
    "python-dotenv==1.0.1",
    "python-decouple==3.8",
    "httpx",
    "google-genai",
    "asyncpg",
    "tortoise-orm",
    "notion-client==2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "isort",
    "flake8",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]
web = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "cryptography==42.0.7",
    "hypercorn",
]
serverless = [
    # All serverless dependencies are already in base dependencies
    # This group exists for semantic clarity and future serverless-specific packages
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["managers*", "models*", "routers*", "utils*", "exceptions*"]