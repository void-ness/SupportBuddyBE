name: 'Setup Python Environment with UV'
description: 'Set up Python with UV for fast dependency installation'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.10'
  force-rebuild:
    description: 'Force cache rebuild (change this value to invalidate cache)'
    required: false
    default: 'v1'
  dependency-group:
    description: 'Dependency group to install (default: all, options: dev, web, serverless)'
    required: false
    default: 'web'

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install UV
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          requirements.txt
        cache-suffix: ${{ inputs.force-rebuild }}

    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ inputs.dependency-group }}" = "dev" ]; then
          uv pip install -e . --group dev --system
        elif [ "${{ inputs.dependency-group }}" = "web" ]; then
          uv pip install -e . --group web --system
        elif [ "${{ inputs.dependency-group }}" = "serverless" ]; then
          uv pip install -e . --group serverless --system
        else
          uv pip install -e . --system
        fi