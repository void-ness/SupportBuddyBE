name: 'Setup Python Environment with Pip'
description: 'Set up Python with pip for reliable dependency installation'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.10'
  force-rebuild:
    description: 'Force cache rebuild (change this value to invalidate cache)'
    required: false
    default: 'v1'
  dependency-group:
    description: 'Dependency group to install (default: all, options: dev, web, serverless)'
    required: false
    default: 'serverless'

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          serverless_requirements.txt

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ inputs.dependency-group }}" = "web" ]; then
          pip install -r requirements.txt
        elif [ "${{ inputs.dependency-group }}" = "serverless" ]; then
          pip install -r serverless_requirements.txt
        else
          pip install -r requirements.txt
        fi