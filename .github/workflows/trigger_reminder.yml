name: Evening Reminder Emails

on:
  # Run daily at 8:00 PM IST (2:30 PM UTC)
  schedule:
    - cron: '30 14 * * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  send-reminders:
    environment: production
    runs-on: ubuntu-latest
    
    env:
      # Database Configuration
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_CONNECTION_TYPE: ${{ secrets.DB_CONNECTION_TYPE }}
      
      # API Keys
      MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
      MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
            
      # Encryption Key
      FERNET_KEY: ${{ secrets.FERNET_KEY }}
      
      # Google GenAI Configuration
      GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
      GOOGLE_GENAI_MODEL: ${{ secrets.GOOGLE_GENAI_MODEL }}
      
      # Configuration
      ENV: ${{ secrets.ENV }}
      REMINDER_EMAIL_DAYS: ${{ secrets.REMINDER_EMAIL_DAYS }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Verify Environment
        run: |
          echo "🔍 Verifying environment for reminder emails..."
          echo "✅ Database connection type: $DB_CONNECTION_TYPE"
          echo "✅ Mailgun API configured: $([ -n "$MAILGUN_API_KEY" ] && echo "Yes" || echo "No")"
          echo "✅ Google GenAI API configured: $([ -n "$GOOGLE_GENAI_API_KEY" ] && echo "Yes" || echo "No")"
          echo "✅ Reminder email days: $REMINDER_EMAIL_DAYS"

      - name: Send Reminder Emails
        run: |
          echo "🌆 Starting evening reminder emails at 8:00 PM IST..."
          export TASK_TYPE=send-reminders
          python serverless_runner.py

      - name: Report Success
        run: |
          echo "✅ Evening reminder emails sent successfully!"

      - name: Report Failure
        if: failure()
        run: |
          echo "❌ Evening reminder email process failed!"
          exit 1